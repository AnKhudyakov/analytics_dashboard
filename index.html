<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="fav.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e14" />
    <meta
      name="description"
      content="YouTube analytics dashboard: channel and video metrics, revenue estimates and trends."
    />
    <meta property="og:title" content="Analytics dashboard" />
    <meta
      property="og:description"
      content="YouTube analytics dashboard: channel and video metrics, revenue estimates and trends."
    />
    <title>Analytics dashboard</title>

    <script>
      (() => {
        const stored = localStorage.getItem('theme');
        const mode =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        document.documentElement.classList.add(mode);
        document.documentElement.style.colorScheme = mode;
      })();
    </script>

    <style>
      :root {
        --boot-bg: #fafafa;
        --boot-fg: #000a12;
      }

      html.dark {
        --boot-bg: #0b0e14;
        --boot-fg: #c7ceec;
      }

      body {
        margin: 0;
        background: var(--boot-bg);
        color: var(--boot-fg);
      }

      .boot-screen {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-bg);
      }

      .boot-spinner {
        width: 3rem;
        height: 3rem;
        border: 3px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation-duration: 3s;
        }
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-label="Loading">
        <div class="boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
